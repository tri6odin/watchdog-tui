[global]
http_user_agent = watchdog-tui/1.0

[lcl_net]
address = 192.168.50.1
timeout_seconds = 1.0

[int_net]
host = ya.ru
port = 443
timeout_seconds = 1.0

[vpn]
host = instagram.com
port = 443
timeout_seconds = 5.0

[haos]
address = 192.168.50.4
port = 8123
api_path = /api/config
timeout_seconds = 2.0
token = paste_home_assistant_long_lived_token_here

[zigbee]
max_offline_devices = 0
timeout_seconds = 5.0

[nas]
address = 192.168.50.3
port = 445
tcp_timeout_seconds = 1.0
smb_timeout_seconds = 5.0
smb_user = watchdog
smb_pass = paste_smb_password_here
smb_share = BACKUP

[wifi]
ssid = example-wifi
password = paste_wifi_password_here
gateway = 192.168.50.1
interface = auto
connect_timeout_seconds = 25.0
ready_timeout_seconds = 10.0
ping_timeout_seconds = 2.0
disconnect_after_check = true

[iot_wifi]
ssid = example-iot
password = paste_iot_wifi_password_here
gateway = 192.168.50.1
interface = auto
connect_timeout_seconds = 25.0
ready_timeout_seconds = 10.0
ping_timeout_seconds = 2.0
disconnect_after_check = true

[touch]
enabled = true
event_device = auto
swipe_min_dx = 1200
swipe_max_dt_sec = 2.2
swipe_horizontal_ratio = 1.1
